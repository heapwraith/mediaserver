# Weekly update pull requests: security fixes and new versions. Every update
# goes through the same CI and the protected main branch.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Major versions break the toolchain together (svelte-check needs the
      # matching TypeScript); upgrade them by hand, in one pull request.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    ignore:
      # CI and the docs use Node 24: move Node everywhere at once.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gradle
    directory: /tv/android
    schedule: {interval: weekly}
    ignore:
      # Gradle and the Android Gradle Plugin must go up together, and the CI
      # does not build the .apk: upgrade by hand and build it.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
