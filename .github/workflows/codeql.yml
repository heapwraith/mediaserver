# Static analysis (CodeQL) of the Go server and the TypeScript/Svelte frontend.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1' # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # Go has no "none" mode: build with an empty frontend stub (the Go
          # packages only need web/build to exist for go:embed).
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
          queries: security-extended

      - name: Build (Go)
        if: matrix.language == 'go'
        run: |
          make web-stub
          go build ./...

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
