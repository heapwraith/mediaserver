# Runs the same commands a developer runs (AGENTS.md §10) on the three
# operating systems the server and its developers use.
name: CI

on:
  push: # every branch
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash # Git Bash on Windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Tool versions
        run: |
          go version
          node --version
          make --version | head -1
          bash --version | head -1
          echo "C compiler: $(go env CC) -> $(command -v "$(go env CC)" || echo 'not found (tests run without -race)')"

      - name: make check
        run: make check

      - name: make test
        run: make test

      - name: make build (6 binaries, no CGO)
        if: runner.os == 'Linux'
        run: |
          make build
          ls -la dist
          for f in dist/*; do go version -m "$f" | grep -q 'CGO_ENABLED=0' || { echo "$f was built with CGO"; exit 1; }; done
