# Runs the same commands a developer runs (AGENTS.md §10) on the three
# operating systems the server and its developers use.
name: CI

on:
  push: # every branch
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash # Git Bash on Windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Tool versions
        run: |
          go version
          node --version
          make --version | head -1
          bash --version | head -1
          echo "C compiler: $(go env CC) -> $(command -v "$(go env CC)" || echo 'not found (tests run without -race)')"

      - name: make check
        run: make check

      - name: make test
        run: make test

      - name: make build (6 binaries, no CGO)
        if: runner.os == 'Linux'
        run: |
          make build
          ls -la dist
          for f in dist/*; do go version -m "$f" | grep -q 'CGO_ENABLED=0' || { echo "$f was built with CGO"; exit 1; }; done

  # Known vulnerabilities in what we ship (Go standard library and modules, npm
  # packages that go into the build). Fails on any finding that is reachable.
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: npm audit (production dependencies)
        run: npm --prefix web audit --omit=dev --audit-level=low

      - name: Licenses (GPL-3.0-or-later compatible)
        run: |
          npm --prefix web ci --ignore-scripts --no-fund --no-audit
          npm --prefix web run check:licenses
